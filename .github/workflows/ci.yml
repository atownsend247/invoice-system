name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # pdf.py renders via WeasyPrint, which needs native system libraries
      # (Pango/HarfBuzz) beyond what `uv sync` installs - see
      # docs/deployment.md's WeasyPrint gotcha. ubuntu-latest is a fresh VM
      # per run, so this has to be a step here, not a one-time setup step
      # the way it is for the Jenkins agent/Proxmox container.
      - name: Install WeasyPrint's system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Run tests with coverage
        run: uv run pytest --cov=src/invoice_system --cov-report=term-missing

      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    # Only worth the ~30s of Chromium + two servers once the fast unit
    # suites are known-good - see docs/testing-and-ci.md.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # The live backend this job spins up serves GET .../pdf routes via
      # pdf.py/WeasyPrint - same native-dependency need as the backend
      # job above.
      - name: Install WeasyPrint's system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Install backend dependencies
        run: uv sync --dev

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: web
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
