# nginx site config, inside the Proxmox LXC container: serves the built
# frontend as static files and reverse-proxies /api/ to the backend
# service on 127.0.0.1:8000 (see invoice-system-api.service) - same
# origin, so the frontend's VITE_API_BASE_URL=/api (see the Jenkinsfile)
# needs no CORS config and no hardcoded domain baked into the build.
#
# deploy.sh installs and re-syncs this file on *every* deploy (unlike
# invoice-system-api.service, which it only ever installs once) - whatever
# is committed here is what ends up live on the container after the next
# deploy, full stop. If you ever add anything by editing the live file
# directly instead of this one - TLS via certbot's --nginx plugin is the
# common case - that change needs to be folded back into this file too, or
# the next deploy will silently overwrite it away. See docs/deployment.md.
#
# The manual equivalent of what deploy.sh does, if you ever need to run it
# by hand:
#
#   sudo cp nginx-invoice-system.conf /etc/nginx/sites-available/invoice-system
#   sudo ln -sf /etc/nginx/sites-available/invoice-system /etc/nginx/sites-enabled/invoice-system
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name invoices.atathome.me;

    root /var/www/invoice-system;
    index index.html;

    # A client-side route (e.g. /invoices/12) has no matching file - fall
    # back to index.html and let react-router handle it.
    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Expense-attachment uploads (see docs/api.md) are capped at 10MB
        # by ExpenseService.add_attachment (core.py's MAX_ATTACHMENT_SIZE)
        # - nginx's own default (1m) would reject one before it ever
        # reaches the API, so this needs to be at least that large.
        client_max_body_size 12m;
    }
}

# Put this behind TLS (certbot/Let's Encrypt or your own CA) before
# treating it as more than a starting point - this example deliberately
# stops at plain HTTP so it doesn't assume how you manage certificates.
