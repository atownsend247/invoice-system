[project]
name = "invoice-system"
version = "0.1.0"
description = "Invoice management backend: accounts, quotes, invoices, PDF export."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "reportlab>=4.2",
    "click>=8.1",
]

[project.scripts]
invoice-system-cli = "invoice_system.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/invoice_system"]

[tool.coverage.report]
fail_under = 90
