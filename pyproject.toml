[project]
name = "invoice-system"
version = "0.1.0"
description = "Invoice management backend: accounts, quotes, invoices, PDF export."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "reportlab>=4.2",
    "click>=8.1",
    "sessionkit @ git+https://github.com/atownsend247/bb-py-sessionkit.git@v0.2.0",
    "python-multipart>=0.0.9",
    "weasyprint>=70.0",
    "jinja2>=3.1.6",
]

[project.scripts]
invoice-system-cli = "invoice_system.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_system"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/invoice_system"]

[tool.coverage.report]
fail_under = 90

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.isort]
known-first-party = ["invoice_system"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's own required idiom (`param: X = Depends(...)`) is a function
# call as a default argument - B008 exists to catch a *mutable* default
# evaluated once at def time, which this specifically isn't (FastAPI
# resolves it per-request). Allowlist the FastAPI markers instead of
# disabling B008 wholesale and losing it for genuine mutable-default bugs.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.File",
]
